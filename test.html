<!DOCTYPE html>
<html lang="en">
<head>
<style>
@font-face {
  font-family: "Material Symbols";
  font-style: normal;
  font-weight: 400;
  src: url(iconfont.woff2) format("woff2");
}
@font-face {
  font-family: "Material Symbols Outlined";
  font-style: normal;
  font-weight: 400;
  src: url(material-symbols-outlined.woff2) format("woff2");
}
.icon {
  font-family: "Material Symbols";
  font-weight: normal;
  font-style: normal;
  max-width: 2em;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-feature-settings: "liga";
  vertical-align: bottom;
  line-height: 1;
  text-align: center;
  width: 1.25em;
}
.icon2 {
  font-family: "Material Symbols Outlined";
  font-weight: normal;
  font-style: normal;
  max-width: 2em;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-feature-settings: "liga";
  vertical-align: bottom;
  line-height: 1;
  text-align: center;
  width: 1.25em;
}
</style>
</head>
<body>
<input oninput="document.querySelector('.icon').innerHTML = document.querySelector('.icon2').innerHTML = this.value;" value="10k"><br>
<span class="icon">10k</span><br>
<span class="icon2">10k</span><br>
</body>
</html>
